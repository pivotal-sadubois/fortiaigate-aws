# Estimated cost $3.55/hour

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: CLUSTER
  region: REGION
  version: "1.35"

availabilityZones:
  - AZ
  - SECOND_AZ

managedNodeGroups:
  - name: faig-ng
    instanceType: r5.4xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 3
    volumeSize: 80
    privateNetworking: true

  # --------------------------------------------------
  # GPU Node Group - EC2 Capacity Reservation
  # --------------------------------------------------
  - name: gpu-ondemand-ng
    instanceType: INSTANCE
    availabilityZones:
      - AZ
    desiredCapacity: 1
    spot: false
    minSize: 0
    maxSize: 2
    volumeSize: 200
    privateNetworking: true
    capacityReservation:
      capacityReservationTarget:
        capacityReservationID: RESERVATION_ID
